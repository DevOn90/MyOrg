<div class="container">
    <span>
        <label for="">Global</label>
        <lib-toggle-switch
        [size]="2"
        [primaryColor]="'#ff9671'"
        [accentColor]="'#f9f871'"
        [eventName]="'toggleGlobal'"
        [isToggleOn]="false"
        variant="squared"
        (switchToggle)="onToggle($event)">
        </lib-toggle-switch>
    </span>
    <span>
        <label>Custom color</label>
        <lib-toggle-switch
            [primaryColor]="'#000000'"
            [accentColor]="'#d65db1'"
            [eventName]="'toggleCustom'"
            [isToggleOn]="false"
            (switchToggle)="onToggle($event)">    
        </lib-toggle-switch>
    </span>
    <span>
        <label for="">Basic</label>
        <lib-toggle-switch
        [eventName]="'toggleBasic'"
        [isToggleOn]="false"
        (switchToggle)="onToggle($event)">
        </lib-toggle-switch>
    </span>
</div>
<router-outlet></router-outlet>
