<div class="container">
    <span>
        <label for="">Custom</label>
        <lib-toggle-switch
        [size]="2"
        [primaryColor]="'#ffffff'"
        [accentColor]="'#bbf8aa'"
        [isToggleOn]="false"
        variant="squared"
        (switchToggle)="onToggle($event)">
        </lib-toggle-switch>
    </span>
    <span>
        <label>Global</label>
        <lib-toggle-switch
            [isToggleOn]="false"
            [disabled]="false"
            (switchToggle)="onToggle($event)">    
        </lib-toggle-switch>
    </span>
    <span>
        <label for="">Basic</label>
        <lib-toggle-switch
        [isToggleOn]="false"
        (switchToggle)="onToggle($event)"
        [disabled]="false">
        </lib-toggle-switch>
    </span>
</div>
<router-outlet></router-outlet>
