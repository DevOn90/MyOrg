        <lib-toggle-switch

            id:' ',
            size:2,
            primaryColor:'#ffffff',
            accentColor:'#DD0000'
        }"

    <span>
        <label>Global</label>
        <lib-toggle-switch

    <span>
        <label for="">Basic</label>
